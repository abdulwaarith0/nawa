# Optional DEV-ONLY observability & admin GUIs. Kept separate from the canonical
# docker-compose.yml (which is postgres + minio only) so the architecture
# contract stays clean. Start with:
#     docker compose -f docker-compose.tools.yml up -d
# Stop with:
#     docker compose -f docker-compose.tools.yml down
#
# These connect to the DB and the API over host.docker.internal, so they work
# whether the API runs on the host (uvicorn) or elsewhere. The API must be
# running on :8000 for Prometheus/Grafana to have data to show.

# Distinct project name so this stack is fully isolated from the canonical
# compose (postgres/minio) — `... down` here can never touch those.
name: nawa-tools

services:
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: nawa_pgadmin
    restart: unless-stopped
    environment:
      # pgAdmin rejects .local domains — use a plain .com for the login email.
      PGADMIN_DEFAULT_EMAIL: admin@nawa.dev
      PGADMIN_DEFAULT_PASSWORD: nawa
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./tools/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - nawa_pgadmin_data:/var/lib/pgadmin
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nawa_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./tools/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nawa_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nawa_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: nawa
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"
    volumes:
      - ./tools/grafana/provisioning:/etc/grafana/provisioning:ro
      - nawa_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  nawa_pgadmin_data:
  nawa_prometheus_data:
  nawa_grafana_data:
